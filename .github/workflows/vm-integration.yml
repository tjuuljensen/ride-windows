name: Disposable VM integration

on:
  push:
    branches: [master, codex/ride-v3-migration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ride-vm-integration
  cancel-in-progress: false

jobs:
  vm-tests:
    # Keep migration-pilot activation separate from the master cutover switch.
    if: >-
      (github.ref == 'refs/heads/master' && vars.RIDE_VM_TESTS_ENABLED == 'true') ||
      (github.ref == 'refs/heads/codex/ride-v3-migration' && vars.RIDE_VM_PILOT_ENABLED == 'true')
    runs-on: [self-hosted, Windows, X64, ride-hyperv]
    timeout-minutes: 105
    env:
      RIDE_AUTOMATION_CONFIGURATION: ${{ vars.RIDE_AUTOMATION_CONFIGURATION }}
      RIDE_VM_PILOT: ${{ github.ref == 'refs/heads/codex/ride-v3-migration' }}
      RIDE_VM_PILOT_MODE: ${{ vars.RIDE_VM_PILOT_MODE || 'UnitOnly' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Request the registered elevated task
        id: test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:RIDE_AUTOMATION_CONFIGURATION) { throw 'Set RIDE_AUTOMATION_CONFIGURATION to the installed configuration.json path.' }
          $config = Get-Content -LiteralPath $env:RIDE_AUTOMATION_CONFIGURATION -Raw | ConvertFrom-Json
          if ((Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path.TrimEnd('\') -ne $config.CIRepositoryPath.TrimEnd('\')) { throw 'Runner checkout does not match the approved CIRepositoryPath.' }
          $client = Join-Path (Split-Path -Parent $env:RIDE_AUTOMATION_CONFIGURATION) 'bin\Invoke-RideVmTestTask.ps1'
          $receipt = Join-Path $env:RUNNER_TEMP 'ride-vm-request.json'
          if (Test-Path -LiteralPath $receipt) { Remove-Item -LiteralPath $receipt -Force }
          $parameters = @{ ConfigurationPath = $env:RIDE_AUTOMATION_CONFIGURATION; Source = 'CI'; ReceiptPath = $receipt }
          if ($env:RIDE_VM_PILOT -eq 'true') {
            if ($env:RIDE_VM_PILOT_MODE -notin @('UnitOnly', 'Full')) { throw 'RIDE_VM_PILOT_MODE must be UnitOnly or Full.' }
            if ($env:RIDE_VM_PILOT_MODE -eq 'UnitOnly') { $parameters.UnitOnly = $true }
          }
          try { & $client @parameters }
          finally {
            if (Test-Path -LiteralPath $receipt) {
              $request = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
              "results=$($request.ResultDirectory)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
              "run_id=$($request.RunId)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            }
          }
      - name: Upload this request's evidence
        if: always() && steps.test.outputs.results != ''
        uses: actions/upload-artifact@v4
        with:
          name: ride-vm-${{ steps.test.outputs.run_id }}
          if-no-files-found: warn
          path: |
            ${{ steps.test.outputs.results }}/result.json
            ${{ steps.test.outputs.results }}/controller*.log
            ${{ steps.test.outputs.results }}/collection*.log
            ${{ steps.test.outputs.results }}/source-files.json
            ${{ steps.test.outputs.results }}/guest/**
